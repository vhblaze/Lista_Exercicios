<!DOCTYPE html>

<meta charset="UTF-8">
<title>Algumas marcas</title>

<body>
  <h3>Algumas marcas</h3>

  <p><i>Este parágrafo está em itálico.</i></p>

  <p><u>Parágrafo sublinhado...</u></p>

  <p>Utilizando a marca <big>big</big> e a marca <small>small</small></p>

  <p>Mais uma marca que permite expressões do género x<sup>2</sup> e x<sub>2</sub></p>

  <p>Exemplos de caracteres especiais:<br>
  &aacute; &agrave; &atilde; &acirc; &ccedil; &eacute; &egrave; &otilde;</p>
</body>
</html>
