<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 17 - Soma de 2 inteiros</title>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; }
  input { width: 80px; padding: 4px; }
</style>
</head>
<body>
  <h2>Soma de dois números inteiros</h2>

  <p>
    Número 1: <input type="number" id="numero1" value="10">
    Número 2: <input type="number" id="numero2" value="5">
    <button onclick="somar()">Somar</button>
  </p>

  <script>
    function somar() {
      var numero1 = parseInt(document.getElementById("numero1").value);
      var numero2 = parseInt(document.getElementById("numero2").value);

      if (isNaN(numero1) || isNaN(numero2)) {
        alert("Digite dois números inteiros!");
        return;
      }
      alert(numero1 + numero2);
    }
  </script>
</body>
</html>
