<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 26 - Menu com a tag nav</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; }
  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: #1f3fb5;
    overflow: hidden;
  }
  nav li { float: left; }
  nav li a {
    display: block;
    color: #ffffff;
    padding: 16px 24px;
    text-decoration: none;
    font-weight: bold;
  }
  nav li a:hover { background: #ffd54f; color: #1f3fb5; }
  main { padding: 24px; }
</style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Sobre</a></li>
      <li><a href="https://www.unitri.edu.br" target="_blank">Unitri</a></li>
    </ul>
  </nav>

  <main>
    <h1>Menu de navegação</h1>
    <p>Barra de navegação criada com a tag nav, uma lista (ul) e CSS.</p>
  </main>
</body>
</html>
