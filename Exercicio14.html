<title>Exercício 14 - Estilos</title>
<style type="text/css">
  /* Links: cor #800000, letras de 8 pontos, sem sublinhado */
  a {
    color: #800000;
    font-size: 8pt;
    text-decoration: none;
  }
  /* Mouse em cima do link: cor #800080 e negrito */
  a:hover {
    color: #800080;
    font-weight: bold;
  }

  /* Títulos */
  h1 {
    font-size: x-large;
    color: red;
  }
  h2 {
    font-size: large;
    color: blue;
  }

  /* Parágrafos: Times, 12 pontos, azul, recuo de meia polegada */
  p {
    font-family: "Times New Roman", Times, serif;
    font-size: 12pt;
    color: blue;
    margin-left: 0.5in;
  }
</style>
</head>
