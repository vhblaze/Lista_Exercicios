<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 20 - Calculadora</title>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; }
  .calc { width: 240px; border: 2px solid #333333; border-radius: 10px; padding: 12px; background: #eeeeee; }
  #visor { width: 100%; box-sizing: border-box; font-size: 24px; text-align: right; padding: 8px; margin-bottom: 10px; }
  .teclas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .teclas button { font-size: 20px; padding: 12px 0; cursor: pointer; }
  .op { background: #ffd54f; }
  .igual { background: #66bb6a; }
  .limpar { background: #ef5350; color: #ffffff; }
</style>
</head>
<body>
  <h2>Calculadora simples</h2>

  <div class="calc">
    <input type="text" id="visor" value="0" readonly>
    <div class="teclas">
      <button class="limpar" onclick="limpar()">C</button>
      <button class="op" onclick="operador('/')">/</button>
      <button class="op" onclick="operador('*')">x</button>
      <button class="op" onclick="operador('-')">-</button>

      <button onclick="digito('7')">7</button>
      <button onclick="digito('8')">8</button>
      <button onclick="digito('9')">9</button>
      <button class="op" onclick="operador('+')">+</button>

      <button onclick="digito('4')">4</button>
      <button onclick="digito('5')">5</button>
      <button onclick="digito('6')">6</button>
      <button class="igual" onclick="igual()" style="grid-row: span 2;">=</button>

      <button onclick="digito('1')">1</button>
      <button onclick="digito('2')">2</button>
      <button onclick="digito('3')">3</button>

      <button onclick="digito('0')" style="grid-column: span 2;">0</button>
      <button onclick="digito('.')">.</button>
    </div>
  </div>

  <script>
    var atual = "0";       // número que está sendo digitado
    var anterior = null;   // primeiro número da operação
    var operacao = null;   // operação escolhida
    var novoNumero = true; // próxima tecla começa um novo número?

    function mostrar() {
      document.getElementById("visor").value = atual;
    }

    function digito(d) {
      if (novoNumero) {
        atual = (d === ".") ? "0." : d;
        novoNumero = false;
      } else {
        if (d === "." && atual.indexOf(".") !== -1) return;
        atual = (atual === "0" && d !== ".") ? d : atual + d;
      }
      mostrar();
    }

    function calcular(a, b, op) {
      switch (op) {
        case "+": return a + b;
        case "-": return a - b;
        case "*": return a * b;
        case "/": return b === 0 ? "Erro" : a / b;
      }
      return b;
    }

    function operador(op) {
      if (operacao !== null && !novoNumero) {
        igual();
      }
      anterior = parseFloat(atual);
      operacao = op;
      novoNumero = true;
    }

    function igual() {
      if (operacao === null || anterior === null) return;
      var resultado = calcular(anterior, parseFloat(atual), operacao);
      if (resultado === "Erro") {
        atual = "Erro";
        anterior = null;
      } else {
        atual = String(Math.round(resultado * 1000000000) / 1000000000);
        anterior = null;
      }
      operacao = null;
      novoNumero = true;
      mostrar();
    }

    function limpar() {
      atual = "0";
      anterior = null;
      operacao = null;
      novoNumero = true;
      mostrar();
    }
  </script>
</body>
</html>
