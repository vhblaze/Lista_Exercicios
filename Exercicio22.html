<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 22 - Data atual</title>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; }
  #data { font-size: 32px; font-weight: bold; color: #1f3fb5; }
</style>
</head>
<body>
  <h2>Data atual</h2>
  <p>Hoje é: <span id="data"></span></p>

  <script>
    var hoje = new Date();
    var dia = String(hoje.getDate()).padStart(2, "0");
    var mes = String(hoje.getMonth() + 1).padStart(2, "0"); // os meses começam em 0
    var ano = hoje.getFullYear();

    document.getElementById("data").innerHTML = dia + "/" + mes + "/" + ano;
  </script>
</body>
</html>
