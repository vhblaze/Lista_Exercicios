<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundo Games - Contato</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <nav class="menu">
    <a href="index.html">Início</a>
    <a href="jogos.html">Jogos</a>
    <a href="consoles.html">Consoles</a>
    <a href="ranking.html">Ranking</a>
    <a href="contato.html">Contato</a>
  </nav>

  <div class="container">
    <div class="destaque">
      <h1>Contato</h1>
      <p>Quer sugerir um jogo ou bater um papo? Escreva aqui.</p>
    </div>

    <div class="cartao">
      <h2>Fale comigo</h2>
      <form class="formulario" action="#" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5"></textarea>

        <p><input type="submit" value="Enviar" class="botao" style="width: auto; border: 0; cursor: pointer;"></p>
      </form>
      <p><a href="index.html">Voltar para a página inicial</a></p>
    </div>
  </div>

  <div class="rodape">Mundo Games © 2026 - Programação para Internet</div>
</body>
</html>
